# Cloudflare Pages project + D1 binding for DiceFlow analytics.
# The Pages project name must match the project in the Cloudflare dashboard.
name = "diceflow-app"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# Anonymous analytics storage (see database/schema.sql).
# Create with: npx wrangler d1 create diceflow-analytics
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "diceflow-analytics"
database_id = "de97c6de-e696-4459-9510-6f09d095b4bd"
migrations_dir = "database/migrations"
